name: Daily Contest Sync

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit DB changes
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Restore Google Calendar Token
      env:
        GOOGLE_CALENDAR_TOKEN: ${{ secrets.GOOGLE_CALENDAR_TOKEN }}
      run: |
        if [ ! -z "$GOOGLE_CALENDAR_TOKEN" ]; then
          echo "$GOOGLE_CALENDAR_TOKEN" > token.json
        else
          echo "Warning: GOOGLE_CALENDAR_TOKEN secret is not set!"
        fi
        
    - name: Run ContestPilot Sync
      run: |
        python main.py
        
    - name: Commit Database Updates
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add contestpilot.db || true
        git commit -m "Automated database update" || true
        git push || true
